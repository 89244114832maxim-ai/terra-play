name: Проверка архива после Pages
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
permissions: {}
concurrency:
  group: release-after-pages-probe
  cancel-in-progress: false
jobs:
  probe:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Сверить источник развёртывания
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          test "$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)" = "$DEPLOY_SHA"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Проверить архив без публикации
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          STARTED_AT: ${{ github.event.workflow_run.created_at }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          tag="build-$(date -u -d "$STARTED_AT" +%Y%m%d-%H%M)"
          python3 tools/release_package.py --event "$GITHUB_EVENT_PATH" --current "$DEPLOY_SHA" --tag "$tag" --root . --output "$RUNNER_TEMP/terra.zip"
          test "$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)" = "$DEPLOY_SHA"
