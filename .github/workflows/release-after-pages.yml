name: Проверка архива после Pages
on:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: release-after-pages-probe
  cancel-in-progress: true
jobs:
  probe:
    if: github.repository == '89244114832maxim-ai/terra-play'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Проверить развёртывание и архив
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/pages_probe.py
